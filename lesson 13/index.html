<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess game</title>
</head>
<body>
     
    <h1>Luky draw</h1>
    <p>Enter your name and guess a number to win!</p>

    <input type="number" id="guess" placeholder="Your name" required><br> <p id="msg-name"></p>

     <input type="number" id="guess" placeholder="Guess a number" min="1" max="5" required><br> <p id="msg-guess"></p>

     <button onclick="checkForm()">Try my luck!</button>
     <p id="result"></p>
     <p id="timer"></p>
</body>
</html>
