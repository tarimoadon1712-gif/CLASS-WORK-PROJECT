<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOO PARK</title>
</head>
<body>
    
    <h1>My Zoo</h1>
    <p>Use JavaScript and the dom to add animals to each cage!</p>

    <div id="Zoo">
        <div class="zone">Zone 1: <spawn id="zone1"></spawn></div>
        <div class="zone">Zone 2: <spawn id="zone2"></spawn></div>
        <div class="zone">Zone 3: <spawn id="zone3"></spawn></div>
        <div class="zone">Total Animals: <spawn id="total"></spawn></div>
    </div>

    <br>

    <button onclick="openZoo()">Open the Zoo</button>
     <p id="zoo-status"></p>

    <script>

        function openZoo() {
            document.getElementById("zone1").innerHTML = "Lion";

            document.getElementById("zone2").innerHTML = "Elephant";

            document.getElementById("zone3").innerHTML = "Penguin";

            document.getElementById("total").innerHTML = "3";

            document.getElementById("Zoo").style.backgroundColor = "orange";

            document.getElementById("zoo-status").innerHTML = document.title + " Is now open !";
        }
    </script>
</body>
</html>
