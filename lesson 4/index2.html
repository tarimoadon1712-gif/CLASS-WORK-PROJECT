<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        var day;
        switch (new Date().getday()) {
            case 0:
            day = "sunday";
            break;
            case 1:
            day = "monday";
            break;
            case 2:
            day = "tusday";
            break;
            case 3:
            day = "wenesday";
            break;
            case 4:
            day = "thursday";
            break;
            case 0:
            day = "friday";
            break;
            case 0:
            day = "saturday";
            break;
        }
        document.getElementById("demo").innerHTML = "Today is " + day;
    </script>
</body>
</html>
